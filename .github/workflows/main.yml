name: Build C# UnityText

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # غيّر الإصدار إذا كان مشروعك يطلب إصداراً آخر

    - name: Restore Dependencies
      run: dotnet restore UnityText.sln # ضع الاسم الصحيح لملف الـ .sln أو .csproj هنا

    - name: Build Release
      run: dotnet build UnityText.sln --configuration Release --no-restore

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: UnityText-Executable
        path: '**/bin/Release/'
